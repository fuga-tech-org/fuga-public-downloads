name: Publish Download Release

on:
  repository_dispatch:
    types: [publish_download_release]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate payload and resolve paths
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          PRODUCT='${{ github.event.client_payload.product }}'
          VERSION='${{ github.event.client_payload.version }}'
          SOURCE_TAG='${{ github.event.client_payload.source_tag }}'
          SOURCE_REPOSITORY='${{ github.event.client_payload.source_repository }}'
          DOWNLOAD_URL='${{ github.event.client_payload.public_download_url }}'
          RELEASE_NOTES='${{ github.event.client_payload.release_notes }}'

          FILE_NAME='${{ github.event.client_payload.file_name }}'
          FILE_PATH='${{ github.event.client_payload.file_path }}'

          test -n "$PRODUCT"
          test -n "$VERSION"



          if [ -z "$FILE_PATH" ] && [ -n "$FILE_NAME" ]; then
            mapfile -t matches < <(find . -type f -name "$FILE_NAME" -print)
            if [ "${#matches[@]}" -eq 1 ]; then
              FILE_PATH="${matches[0]#./}"
            elif [ "${#matches[@]}" -gt 1 ]; then
              echo "Ambiguous file_name '$FILE_NAME'. Provide client_payload.file_path explicitly."
              printf 'Matches:\n%s\n' "${matches[@]}"
              exit 1
            else
              FILE_PATH="${PRODUCT}/${FILE_NAME}"
            fi
          fi

          test -n "$FILE_NAME"
          test -n "$FILE_PATH"

          [[ "$PRODUCT" =~ ^[a-z0-9._-]+$ ]] || { echo "Invalid product"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          [[ "$FILE_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid file_name"; exit 1; }

          [[ "$FILE_PATH" != /* ]] || { echo "Absolute path not allowed"; exit 1; }
          [[ "$FILE_PATH" != *".."* ]] || { echo "Path traversal not allowed"; exit 1; }
          [[ "$FILE_PATH" != *"\\"* ]] || { echo "Backslashes not allowed"; exit 1; }

          [ -f "$FILE_PATH" ] || { echo "File not found in repo: $FILE_PATH"; exit 1; }

          RELEASE_TAG="${PRODUCT}-v${VERSION}"
          RELEASE_NAME="${PRODUCT}-v${VERSION}"

          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_name=$RELEASE_NAME"
            echo "file_name=$FILE_NAME"
            echo "file_path=$FILE_PATH"
            echo "source_tag=$SOURCE_TAG"
            echo "source_repository=$SOURCE_REPOSITORY"
            echo "download_url=$DOWNLOAD_URL"
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create/update release announcement issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_NAME: ${{ steps.payload.outputs.release_name }}
          FILE_PATH: ${{ steps.payload.outputs.file_path }}
          SOURCE_TAG: ${{ steps.payload.outputs.source_tag }}
          SOURCE_REPOSITORY: ${{ steps.payload.outputs.source_repository }}
          DOWNLOAD_URL: ${{ steps.payload.outputs.download_url }}
          RELEASE_NOTES: ${{ steps.payload.outputs.release_notes }}
        run: |
          set -euo pipefail

          TITLE="[Release] ${RELEASE_NAME}"
          BODY_FILE="$(mktemp)"
          {
            echo "Product release: ${RELEASE_NAME}"
            echo "Source repository: ${SOURCE_REPOSITORY}"
            [ -n "${SOURCE_TAG}" ] && echo "Source tag: ${SOURCE_TAG}"
            [ -n "${DOWNLOAD_URL}" ] && echo "Download URL: ${DOWNLOAD_URL}"
            echo "File: ${FILE_PATH}"
            echo
            echo "${RELEASE_NOTES}"
          } > "$BODY_FILE"

          ISSUE_NUMBER="$(gh issue list --repo "${REPO}" --state open --search "${TITLE} in:title" --json number,title --jq 'map(select(.title=="'"${TITLE}"'"))[0].number' || true)"

          if [ -n "${ISSUE_NUMBER}" ] && [ "${ISSUE_NUMBER}" != "null" ]; then
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --title "${TITLE}" --body-file "$BODY_FILE" >/dev/null
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --body-file "$BODY_FILE" >/dev/null
          fi
